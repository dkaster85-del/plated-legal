<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plated Fitness &mdash; Legal</title>
<style>
  :root { color-scheme: light dark; --bg:#ffffff; --fg:#16181c; --muted:#5d636e; --rule:#e3e6ea; --accent:#1f7a4d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d0d0d; --fg:#e9eaec; --muted:#9aa0a8; --rule:#25272b; --accent:#4ade80; }
  }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:64px 22px; }
  h1 { font-size:28px; letter-spacing:-.02em; margin:0 0 6px; }
  p.sub { color:var(--muted); font-size:14px; margin:0 0 32px; padding-bottom:24px; border-bottom:1px solid var(--rule); }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:14px 0; border-bottom:1px solid var(--rule); }
  a { color:var(--accent); font-weight:600; text-decoration:none; }
  a:hover, a:focus-visible { text-decoration:underline; }
  footer { margin-top:40px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>Plated Fitness</h1>
  <p class="sub">Legal documents</p>
  <ul>
    <li><a href="/privacy">Privacy Policy</a></li>
    <li><a href="/terms">Terms of Use</a></li>
  </ul>
  <footer>Questions: <a href="mailto:support@plated-fitness.com">support@plated-fitness.com</a></footer>
</main>
</body>
</html>
